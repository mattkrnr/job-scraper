name: Scrape jobs

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch: {}       # "Run workflow" button on the Actions tab

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - name: Run saved searches
        working-directory: scraper
        env:
          JOB_SCRAPER_TOKEN: ${{ secrets.JOB_SCRAPER_TOKEN }}
        run: |
          if [ -z "$JOB_SCRAPER_TOKEN" ]; then
            echo "::error::Repo secret JOB_SCRAPER_TOKEN is missing. Add it under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          python scrape.py
