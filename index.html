<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Scraper</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #fff; --ink: #1d1d1b; --muted: #6d6b64; --line: #e3e0d8;
    --accent: #2f5d50; --accent-soft: #e3eee9; --warn: #a2482b; --chip: #efede6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --card: #1f1f1d; --ink: #ecebe6; --muted: #9a978e; --line: #33322e;
      --accent: #7fbfa9; --accent-soft: #23332d; --warn: #e08a6a; --chip: #2a2926; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--card); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  header .title { display: flex; align-items: center; gap: 10px; }
  .home-back { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); text-decoration: none; font-size: 16px; line-height: 1; }
  .home-back:hover { border-color: var(--accent); }
  header .who { color: var(--muted); font-size: 13px; display: flex; gap: 10px; align-items: center; }
  main { display: grid; grid-template-columns: 300px 1fr; gap: 20px; padding: 20px; max-width: 1300px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 12px; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--card); font-weight: 600; }
  button.danger { color: var(--warn); }
  button.small { padding: 3px 9px; font-size: 13px; }
  input[type=text], input[type=email], input[type=number], select { font: inherit; width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .field { display: block; margin-bottom: 14px; }
  .field > span { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px; }
  .checks label { background: var(--chip); border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; user-select: none; border: 1px solid transparent; }
  .checks input { display: none; }
  .checks label:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .search-item { padding: 10px 12px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; margin-bottom: 6px; }
  .search-item:hover { background: var(--bg); }
  .search-item.sel { border-color: var(--accent); background: var(--accent-soft); }
  .search-item .name { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
  .search-item .meta { font-size: 12px; color: var(--muted); }
  .badge { font-size: 11px; background: var(--accent); color: var(--card); border-radius: 999px; padding: 1px 7px; font-weight: 700; }
  .off { opacity: .55; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 4px 0 12px; }
  .tabs button.on { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .job { border-top: 1px solid var(--line); padding: 12px 0; }
  .job:first-child { border-top: 0; }
  .job h3 { margin: 0 0 2px; font-size: 15px; }
  .job h3 a { color: inherit; }
  .job .sub { color: var(--muted); font-size: 13px; }
  .tags { display: flex; gap: 5px; flex-wrap: wrap; margin: 6px 0; }
  .tag { background: var(--chip); border-radius: 6px; padding: 1px 7px; font-size: 12px; }
  .job .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  details summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  details .desc { white-space: pre-wrap; font-size: 13px; max-height: 260px; overflow: auto; background: var(--bg); padding: 10px; border-radius: 8px; margin-top: 6px; }
  .job.unseen h3 { font-weight: 700; }
  .job.seen h3 { font-weight: 500; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 7px; vertical-align: middle; }
  .tag.strong { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .appbox { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 8px; }
  .appbox .field { margin-bottom: 10px; }
  .appbox input, .appbox select { background: var(--card); }
  .status { font-size: 12px; color: var(--muted); margin: -6px 0 12px; }
  .empty { color: var(--muted); padding: 20px 0; text-align: center; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .toolbar h2 { margin: 0; font-size: 17px; }
  #login { max-width: 380px; margin: 80px auto; }
  .stack > * + * { margin-top: 20px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--card); padding: 9px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <div class="title">
    <a id="homeBack" class="home-back" href="/" aria-label="Back to apps" hidden>←</a>
    <h1>Job Scraper</h1>
  </div>
  <div class="who" id="who"></div>
</header>

<div id="login" class="card" hidden>
  <h2 style="margin-top:0">Sign in</h2>
  <p class="hint" style="font-size:14px">We'll email you a sign-in link.</p>
  <form id="loginForm">
    <label class="field"><span>Email</span><input type="email" id="email" required autocomplete="email"></label>
    <button class="primary" type="submit">Send link</button>
  </form>
  <p id="loginMsg" class="hint"></p>
</div>

<div id="notAllowed" class="card" hidden style="max-width:460px;margin:80px auto">
  <h2 style="margin-top:0">Almost there</h2>
  <p>You're signed in as <b></b>, but that email isn't on the list for this app yet. Ask Matt to add it, then reload this page.</p>
</div>

<main id="app" hidden>
  <aside class="card">
    <div class="toolbar"><h2>Searches</h2><button class="primary small" id="newBtn">+ New</button></div>
    <div id="searchList"></div>
  </aside>
  <section class="stack">
    <div class="card" id="editor" hidden></div>
    <div class="card" id="testPanel" hidden></div>
    <div class="card" id="matches" hidden></div>
    <div class="card empty" id="placeholder">Pick a search on the left or create a new one.</div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
// Back arrow to the apps homepage — shown only when this tab was opened from it (?from=home).
(function homeBack() {
  const url = new URL(location.href);
  if (url.searchParams.get("from") === "home") {
    try { sessionStorage.setItem("fromHome", "1"); } catch (_) {}
    url.searchParams.delete("from");
    history.replaceState(history.state, "", url);
  }
  let fromHome = false;
  try { fromHome = sessionStorage.getItem("fromHome") === "1"; } catch (_) {}
  if (fromHome) document.getElementById("homeBack").hidden = false;
})();
</script>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const sb = createClient("https://lvaxrikegqknfkzrvmbr.supabase.co", "sb_publishable_A_Mn1IHTHj8uV_e2ut0LXw_wGg8qfsA");

const MODES = [["remote", "Remote"], ["hybrid", "Hybrid"], ["onsite", "On-site"]];
const LEVELS = [["entry", "Entry"], ["mid", "Mid"], ["senior", "Senior"], ["lead", "Lead / Manager"]];
const TYPES = [["fulltime", "Full-time"], ["parttime", "Part-time"], ["contract", "Contract"], ["internship", "Internship"]];
const SITES = [["indeed", "Indeed"], ["linkedin", "LinkedIn"], ["google", "Google Jobs"], ["zip_recruiter", "ZipRecruiter"], ["glassdoor", "Glassdoor"]];
const STATUSES = ["new", "saved", "applied", "dismissed"];
const BLANK = { name: "", active: true, origin: "", radius_miles: 25, titles: [], must_include: [], exclude_words: [],
  min_salary: null, include_no_salary: true, work_modes: ["remote", "hybrid", "onsite"], experience_levels: [],
  job_types: [], hours_old: 72, sites: ["indeed", "linkedin"] };

let user = null, searches = [], selectedId = null, draft = null, jobs = [], tab = "new", newCounts = {};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const list = (s) => s.split(",").map((x) => x.trim()).filter(Boolean);
const money = (n) => n == null ? "" : "$" + (n >= 1000 ? Math.round(n / 1000) + "k" : n);
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); }
function ago(ts) {
  if (!ts) return "never";
  const m = Math.round((Date.now() - new Date(ts)) / 60000);
  if (m < 60) return m + "m ago"; if (m < 1440) return Math.round(m / 60) + "h ago"; return Math.round(m / 1440) + "d ago";
}

// ---------- auth ----------
$("loginForm").onsubmit = async (e) => {
  e.preventDefault();
  const { error } = await sb.auth.signInWithOtp({ email: $("email").value.trim(), options: { emailRedirectTo: location.origin + location.pathname } });
  $("loginMsg").textContent = error ? "Couldn't send: " + error.message : "Check your email for the sign-in link.";
};
let booted = false;
sb.auth.onAuthStateChange((_e, session) => {
  const u = session?.user ?? null;
  if (!booted || u?.id !== user?.id) { booted = true; user = u; setTimeout(boot, 0); }
});

async function boot() {
  $("login").hidden = !!user; $("app").hidden = true; $("notAllowed").hidden = true;
  $("who").innerHTML = user ? `${esc(user.email)} <button class="small" id="out">Sign out</button>` : "";
  if (!user) return;
  $("out").onclick = () => sb.auth.signOut();
  const { data: allowed, error } = await sb.rpc("job_am_i_allowed");
  if (!error && allowed === false) {
    $("app").hidden = true; $("notAllowed").hidden = false;
    $("notAllowed").querySelector("b").textContent = user.email;
    return;
  }
  $("app").hidden = false;   // RLS still protects the data if this check itself failed
  await loadSearches();
}

// ---------- searches ----------
async function loadSearches() {
  const { data, error } = await sb.from("job_searches").select("*").order("created_at");
  if (error) { $("searchList").innerHTML = `<p class="hint">Couldn't load searches: ${esc(error.message)}. If you just signed in for the first time, ask Matt to add your email to the allowed list.</p>`; return; }
  searches = data;
  const { data: counts } = await sb.from("job_matches").select("search_id").eq("status", "new");
  newCounts = {}; (counts || []).forEach((r) => newCounts[r.search_id] = (newCounts[r.search_id] || 0) + 1);
  renderList();
  if (selectedId && !searches.find((s) => s.id === selectedId)) selectedId = null;
  if (selectedId) select(selectedId); else if (!draft) showPlaceholder();
}

function renderList() {
  $("searchList").innerHTML = searches.length ? searches.map((s) => `
    <div class="search-item ${s.id === selectedId ? "sel" : ""} ${s.active ? "" : "off"}" data-id="${s.id}">
      <div class="name"><span>${esc(s.name)}</span>${newCounts[s.id] ? `<span class="badge">${newCounts[s.id]}</span>` : ""}</div>
      <div class="meta">${esc(s.origin)} · ${s.radius_miles} mi${s.active ? "" : " · paused"}</div>
      <div class="meta">Last run ${ago(s.last_run_at)}</div>
    </div>`).join("") : `<p class="hint">No searches yet.</p>`;
  document.querySelectorAll(".search-item").forEach((el) => el.onclick = () => select(el.dataset.id));
}

function showPlaceholder() { $("editor").hidden = true; $("matches").hidden = true; $("testPanel").hidden = true; stopPoll(); $("placeholder").hidden = false; }

function select(id) {
  selectedId = id; draft = null; tab = "new";
  renderList();
  renderEditor(searches.find((s) => s.id === id));
  loadMatches();
}

$("newBtn").onclick = () => openDraft({ ...BLANK });

function openDraft(values) {
  selectedId = null; draft = values; renderList();
  renderEditor(values); $("matches").hidden = true;
  setTimeout(() => (values.name ? $("f_origin") : $("f_name")).focus(), 0);
}

function checks(name, options, chosen) {
  return `<div class="checks">${options.map(([v, l]) => `<label><input type="checkbox" name="${name}" value="${v}" ${chosen.includes(v) ? "checked" : ""}>${l}</label>`).join("")}</div>`;
}

function renderEditor(s) {
  $("placeholder").hidden = true; $("editor").hidden = false;
  const isNew = !s.id;
  $("editor").innerHTML = `
    <div class="toolbar">
      <h2>${isNew ? (s.name ? "New search (copy)" : "New search") : "Edit search"}</h2>
      <div style="display:flex;gap:6px">
        ${isNew ? "" : `<button class="small" id="dupBtn">Duplicate</button><button class="small danger" id="delBtn">Delete</button>`}
      </div>
    </div>
    ${isNew ? "" : `<p class="status">Last run ${ago(s.last_run_at)}${s.last_run_status ? " — " + esc(s.last_run_status) : ""}</p>`}
    <form id="editForm">
      <label class="field"><span>Name</span><input type="text" id="f_name" required value="${esc(s.name)}" placeholder="e.g. Backend roles near home"></label>
      <div class="row">
        <label class="field"><span>Origin</span><input type="text" id="f_origin" required value="${esc(s.origin)}" placeholder="ZIP or address"><div class="hint">Where distance is measured from — set per search.</div></label>
        <label class="field"><span>Distance (miles)</span><input type="number" id="f_radius" min="1" max="200" value="${s.radius_miles}"></label>
      </div>
      <label class="field"><span>Job titles to search</span><input type="text" id="f_titles" value="${esc(s.titles.join(", "))}" placeholder="software engineer, backend developer"><div class="hint">Comma-separated. Each one is searched separately.</div></label>
      <div class="row">
        <label class="field"><span>Title must include (any)</span><input type="text" id="f_must" value="${esc(s.must_include.join(", "))}" placeholder="engineer, developer"></label>
        <label class="field"><span>Skip titles with</span><input type="text" id="f_excl" value="${esc(s.exclude_words.join(", "))}" placeholder="clearance, unpaid"></label>
      </div>
      <div class="row">
        <label class="field"><span>Minimum salary (yearly)</span><input type="number" id="f_salary" min="0" step="1000" value="${s.min_salary ?? ""}" placeholder="e.g. 120000"><div class="hint">Hourly pay is converted to yearly (×2080).</div></label>
        <label class="field"><span>Jobs with no salary listed</span>
          <select id="f_nosal"><option value="1" ${s.include_no_salary ? "selected" : ""}>Keep them</option><option value="0" ${s.include_no_salary ? "" : "selected"}>Hide them</option></select></label>
      </div>
      <div class="field"><span>Work setup</span>${checks("modes", MODES, s.work_modes)}</div>
      <div class="field"><span>Experience level</span>${checks("levels", LEVELS, s.experience_levels)}<div class="hint">None selected = any. Guessed from the job title (e.g. "Senior", "Lead", "Junior").</div></div>
      <div class="field"><span>Job type</span>${checks("types", TYPES, s.job_types)}<div class="hint">None selected = any.</div></div>
      <div class="row">
        <label class="field"><span>Posted within</span>
          <select id="f_hours">${[[24, "1 day"], [72, "3 days"], [168, "1 week"], [336, "2 weeks"], [720, "30 days"]].map(([v, l]) => `<option value="${v}" ${s.hours_old == v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
        <label class="field"><span>Status</span>
          <select id="f_active"><option value="1" ${s.active ? "selected" : ""}>Active — checked every 6 hours</option><option value="0" ${s.active ? "" : "selected"}>Paused</option></select></label>
      </div>
      <div class="field"><span>Job boards</span>${checks("sites", SITES, s.sites)}<div class="hint">Indeed and LinkedIn work best. In our checks Google Jobs returned nothing and ZipRecruiter / Glassdoor blocked the scraper.</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" type="submit">${isNew ? "Create search" : "Save changes"}</button>
        <button type="button" id="testBtn" title="Runs these settings once without saving matches">Test these settings</button>
        ${isNew ? `<button type="button" id="cancelBtn">Cancel</button>` : ""}</div>
    </form>`;
  $("testBtn").onclick = () => queueTest(s.id || null);
  loadTest(s.id || null);

  $("editForm").onsubmit = (e) => { e.preventDefault(); save(s); };
  if (isNew) $("cancelBtn").onclick = () => { draft = null; showPlaceholder(); };
  else {
    $("dupBtn").onclick = () => {
      const { id, user_id, created_at, updated_at, last_run_at, last_run_status, last_run_new, ...rest } = s;
      openDraft({ ...rest, name: s.name + " (copy)" });
      toast("Copied — change the origin or filters, then create");
    };
    $("delBtn").onclick = async () => {
      if (!confirm(`Delete "${s.name}" and its saved matches?`)) return;
      const { error } = await sb.from("job_searches").delete().eq("id", s.id);
      if (error) return toast("Delete failed: " + error.message);
      selectedId = null; toast("Deleted"); loadSearches();
    };
  }
}

function picked(name) { return [...document.querySelectorAll(`input[name=${name}]:checked`)].map((i) => i.value); }

function readForm() {
  const row = {
    name: $("f_name").value.trim(), origin: $("f_origin").value.trim(),
    radius_miles: parseInt($("f_radius").value) || 25,
    titles: list($("f_titles").value), must_include: list($("f_must").value), exclude_words: list($("f_excl").value),
    min_salary: $("f_salary").value ? parseInt($("f_salary").value) : null,
    include_no_salary: $("f_nosal").value === "1",
    work_modes: picked("modes"), experience_levels: picked("levels"), job_types: picked("types"),
    hours_old: parseInt($("f_hours").value), active: $("f_active").value === "1", sites: picked("sites"),
  };
  if (!row.name || !row.origin) { toast("Name and origin are required"); return null; }
  if (!row.work_modes.length) { toast("Pick at least one work setup"); return null; }
  if (!row.sites.length) { toast("Pick at least one job board"); return null; }
  return row;
}

async function save(s) {
  const row = readForm();
  if (!row) return;
  const q = s.id ? sb.from("job_searches").update(row).eq("id", s.id).select().single()
                 : sb.from("job_searches").insert(row).select().single();
  const { data, error } = await q;
  if (error) return toast("Save failed: " + error.message);
  toast(s.id ? "Saved" : "Created — first results after the next run");
  draft = null; selectedId = data.id; await loadSearches();
}

// ---------- test runs ----------
let test = null, pollTimer = null;
function stopPoll() { clearTimeout(pollTimer); pollTimer = null; }

async function queueTest(searchId) {
  const params = readForm();
  if (!params) return;
  // One open test per person (enforced by a unique index): replace a waiting one instead of adding another
  const { data: open } = await sb.from("job_test_runs").select("id,status").in("status", ["queued", "running"]).maybeSingle();
  if (open?.status === "running") return toast("A test is running right now — try again when it finishes");
  const { data, error } = open
    ? await sb.from("job_test_runs").update({ search_id: searchId, params, requested_at: new Date().toISOString() })
        .eq("id", open.id).eq("status", "queued").select().single()
    : await sb.from("job_test_runs").insert({ search_id: searchId, params }).select().single();
  if (error) return toast("Couldn't start test: " + (error.code === "23505" || error.code === "PGRST116" ? "it just started running — try again in a few minutes" : error.message));
  if (open) toast("Replaced your waiting test with these settings");
  test = data; renderTest(); poll();
}

async function cancelTest() {
  const { error } = await sb.from("job_test_runs").delete().eq("id", test.id).eq("status", "queued");
  if (error) return toast(error.message);
  stopPoll(); test = null; renderTest(); toast("Test cancelled");
}

async function loadTest(searchId) {
  stopPoll();
  let q = sb.from("job_test_runs").select("*").order("requested_at", { ascending: false }).limit(1);
  q = searchId ? q.eq("search_id", searchId) : q.is("search_id", null).gte("requested_at", new Date(Date.now() - 3600e3).toISOString());
  const { data } = await q;
  test = data?.[0] || null; renderTest();
  if (test && ["queued", "running"].includes(test.status)) poll();
}

function poll() {
  stopPoll();
  pollTimer = setTimeout(async () => {
    if (!test) return;
    const { data } = await sb.from("job_test_runs").select("*").eq("id", test.id).maybeSingle();
    if (!data || data.id !== test?.id) return;
    test = data; renderTest();
    if (["queued", "running"].includes(test.status)) poll();
  }, 15000);
}

function renderTest() {
  const p = $("testPanel");
  if (!test) { p.hidden = true; return; }
  p.hidden = false;
  const when = new Date(test.requested_at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  if (test.status === "queued" || test.status === "running") {
    p.innerHTML = `<div class="toolbar"><h2>Test run</h2></div>
      <p>${test.status === "queued" ? "Waiting for GitHub to pick it up" : "Searching job boards now"}… <span class="hint">(requested ${when}; usually 5–10 minutes, sometimes longer — you can leave this page)</span></p>
      ${test.status === "queued" ? `<button class="small" id="cancelTest">Cancel test</button>` : ""}`;
    if ($("cancelTest")) $("cancelTest").onclick = cancelTest;
    return;
  }
  if (test.status === "error") {
    p.innerHTML = `<div class="toolbar"><h2>Test run failed</h2></div><p class="hint">${esc(test.message)}</p>`;
    return;
  }
  const res = test.results || [];
  const kept = res.filter((r) => r.kept), dropped = res.filter((r) => !r.kept);
  const reasons = {}; dropped.forEach((d) => reasons[d.reason] = (reasons[d.reason] || 0) + 1);
  const row = (r) => {
    const url = /^https?:\/\//.test(r.job_url || "") ? r.job_url : "#";
    const sal = r.salary_min || r.salary_max ? [money(r.salary_min), money(r.salary_max)].filter(Boolean).join("–") : "no salary";
    return `<div class="job"><h3><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)}</a></h3>
      <div class="sub">${esc(r.company)} · ${esc(r.location)}</div>
      <div class="tags">${r.reason ? `<span class="tag strong">${esc(r.reason)}</span>` : ""}<span class="tag">${esc(sal)}</span>
      <span class="tag">${esc(r.work_mode)}</span><span class="tag">${esc(r.experience_level)}</span><span class="tag">${esc(r.site)}</span></div></div>`;
  };
  p.innerHTML = `<div class="toolbar"><h2>Test results</h2><span class="hint">Ran ${ago(test.finished_at)} · preview only, not saved</span></div>
    <p class="status">${esc(test.message)}</p>
    <details open><summary><b>Would match (${kept.length})</b></summary>${kept.length ? kept.map(row).join("") : `<p class="hint">Nothing passed the filters.</p>`}</details>
    <details style="margin-top:12px"><summary><b>Filtered out (${dropped.length})</b>${Object.keys(reasons).length ? " — " + Object.entries(reasons).map(([k, v]) => `${esc(k)}: ${v}`).join(", ") : ""}</summary>${dropped.map(row).join("")}</details>`;
}

// ---------- matches ----------
async function loadMatches() {
  const { data, error } = await sb.from("job_matches").select("*").eq("search_id", selectedId).order("found_at", { ascending: false }).limit(500);
  jobs = error ? [] : data;
  renderMatches();
}

function renderMatches() {
  $("matches").hidden = false;
  const counts = Object.fromEntries(STATUSES.map((s) => [s, jobs.filter((j) => j.status === s).length]));
  const shown = tab === "all" ? jobs : jobs.filter((j) => j.status === tab);
  $("matches").innerHTML = `
    <div class="toolbar"><h2>Matches</h2>${counts.new ? `<button class="small" id="clearNew">Dismiss all new</button>` : ""}</div>
    <div class="tabs">${[...STATUSES, "all"].map((s) => `<button class="small ${tab === s ? "on" : ""}" data-tab="${s}">${s[0].toUpperCase() + s.slice(1)} ${s === "all" ? jobs.length : counts[s]}</button>`).join("")}</div>
    <div>${shown.length ? shown.map(jobHtml).join("") : `<div class="empty">${jobs.length ? "Nothing here." : "No matches yet. The scraper runs every 6 hours."}</div>`}</div>`;
  document.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { tab = b.dataset.tab; renderMatches(); });
  document.querySelectorAll("[data-set]").forEach((b) => b.onclick = () => setStatus(b.dataset.id, b.dataset.set));
  document.querySelectorAll("[data-view]").forEach((b) => b.onclick = () => {
    const j = jobs.find((x) => x.id === b.dataset.view);
    updateJob(j, { viewed_at: j.viewed_at ? null : new Date().toISOString() });
  });
  document.querySelectorAll("[data-saveapp]").forEach((b) => b.onclick = async () => {
    const j = jobs.find((x) => x.id === b.dataset.saveapp);
    const box = document.querySelector(`[data-app="${j.id}"]`);
    const patch = {};
    box.querySelectorAll("[data-f]").forEach((el) => patch[el.dataset.f] = el.value.trim() || null);
    if (patch.application_url && !/^https?:\/\//.test(patch.application_url)) patch.application_url = "https://" + patch.application_url;
    if (await updateJob(j, patch)) toast("Application saved");
  });
  if ($("clearNew")) $("clearNew").onclick = async () => {
    const ids = jobs.filter((j) => j.status === "new").map((j) => j.id);
    const { error } = await sb.from("job_matches").update({ status: "dismissed" }).in("id", ids);
    if (error) return toast(error.message);
    jobs.forEach((j) => { if (j.status === "new") j.status = "dismissed"; }); newCounts[selectedId] = 0; renderList(); renderMatches();
  };
}

const STAGES = [["applied", "Applied — waiting"], ["interviewing", "Interviewing"], ["offer", "Offer"], ["rejected", "Rejected"], ["no_response", "No response"], ["withdrawn", "Withdrew"]];

function appHtml(j) {
  if (j.status !== "applied") return "";
  const link = /^https?:\/\//.test(j.application_url || "") ? j.application_url : "";
  return `<div class="appbox" data-app="${j.id}">
    <div class="row">
      <label class="field"><span>Application status</span>
        <select data-f="application_stage">${STAGES.map(([v, l]) => `<option value="${v}" ${(j.application_stage || "applied") === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <label class="field"><span>Applied on</span><input type="date" data-f="applied_at" value="${esc(j.applied_at || "")}"></label>
    </div>
    <label class="field"><span>Application / status link ${link ? `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer">open ↗</a>` : ""}</span>
      <input type="text" data-f="application_url" value="${esc(j.application_url || "")}" placeholder="https://company.wd5.myworkdayjobs.com/... (where you check status)"></label>
    <label class="field"><span>Notes</span><input type="text" data-f="notes" value="${esc(j.notes || "")}" placeholder="Recruiter name, referral, next step…"></label>
    <button class="small primary" data-saveapp="${j.id}">Save application</button>
  </div>`;
}

function jobHtml(j) {
  const sal = j.salary_min || j.salary_max ? [money(j.salary_min), money(j.salary_max)].filter(Boolean).join("–") : "Salary not listed";
  const modeName = Object.fromEntries(MODES)[j.work_mode] || j.work_mode;
  const levelName = Object.fromEntries(LEVELS)[j.experience_level] || j.experience_level;
  const url = /^https?:\/\//.test(j.job_url || "") ? j.job_url : "#";
  const stageName = Object.fromEntries(STAGES)[j.application_stage];
  return `<div class="job ${j.viewed_at ? "seen" : "unseen"}">
    <h3>${j.viewed_at ? "" : `<span class="dot" title="Not viewed yet"></span>`}<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(j.title)}</a></h3>
    <div class="sub">${esc(j.company)} · ${esc(j.location)}</div>
    <div class="tags">
      <span class="tag">${esc(sal)}</span><span class="tag">${esc(modeName)}</span><span class="tag">${esc(levelName)}</span>
      ${j.job_type ? `<span class="tag">${esc(j.job_type)}</span>` : ""}<span class="tag">${esc(j.site)}</span>
      <span class="tag">${j.date_posted ? "Posted " + esc(j.date_posted) : "Found " + ago(j.found_at)}</span>
      ${j.viewed_at ? `<span class="tag">Viewed ${ago(j.viewed_at)}</span>` : ""}
      ${tab === "all" && j.status !== "new" ? `<span class="tag strong">${esc(j.status === "applied" && stageName ? stageName : j.status)}</span>` : ""}
    </div>
    ${j.description ? `<details><summary>Description</summary><div class="desc">${esc(j.description)}</div></details>` : ""}
    ${appHtml(j)}
    <div class="acts" style="margin-top:8px">
      ${STATUSES.filter((s) => s !== j.status).map((s) => `<button class="small" data-id="${j.id}" data-set="${s}">${{ new: "Back to new", saved: "Save", applied: "I applied", dismissed: "Dismiss" }[s]}</button>`).join("")}
      <button class="small" data-view="${j.id}">${j.viewed_at ? "Mark not viewed" : "Mark viewed"}</button>
    </div>
  </div>`;
}

async function updateJob(j, patch) {
  const { error } = await sb.from("job_matches").update(patch).eq("id", j.id);
  if (error) { toast(error.message); return false; }
  Object.assign(j, patch); renderMatches(); return true;
}

async function setStatus(id, status) {
  const j = jobs.find((x) => x.id === id);
  const patch = { status };
  if (status === "applied") {
    if (!j.applied_at) patch.applied_at = new Date().toLocaleDateString("en-CA");
    if (!j.application_stage) patch.application_stage = "applied";
  }
  const wasNew = j.status === "new";
  if (!(await updateJob(j, patch))) return;
  if (wasNew) newCounts[selectedId]--; if (status === "new") newCounts[selectedId] = (newCounts[selectedId] || 0) + 1;
  renderList();
  if (status === "applied") { tab = "applied"; renderMatches(); toast("Add the application link below so you can check its status later"); }
}
</script>
</body>
